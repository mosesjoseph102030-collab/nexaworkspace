services:
  # ── Backend API ─────────────────────────────────────────────────────────────
  - type: web
    name: nexachat-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /system-monitor/health
    envVars:
      - key: ENV
        value: prod
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: nexachat-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: nexachat-redis
          type: redis
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: '["https://nexachat-frontend.onrender.com"]'
      - key: AI_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  # ── Frontend SPA ─────────────────────────────────────────────────────────────
  - type: web
    name: nexachat-frontend
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    pullRequestPreviewsEnabled: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://nexachat-backend.onrender.com
      - key: VITE_WS_URL
        value: wss://nexachat-backend.onrender.com

databases:
  - name: nexachat-db
    plan: starter
    databaseName: nexachat
    user: nexachat

  - name: nexachat-redis
    type: redis
    plan: starter
    ipAllowList: []
